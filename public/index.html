<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브리사 대본·음원</title>
<style>
:root {
  --bg: #f7f4ee; --panel: #fffdf8; --ink: #22201c; --muted: #7a746a; --line: #e4ddd0;
  --accent: #c2531f; --accent-soft: #f6e3d7; --lyr: #1f3a5f; --dia: #3d3a35; --mark: #2f7d4f;
  --rehearse: #fff1c7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17161a; --panel: #1f1e23; --ink: #ece8e1; --muted: #9a948a; --line: #34323a;
    --accent: #ef8a54; --accent-soft: #3a2a22; --lyr: #a9c7ef; --dia: #d7d2ca; --mark: #6fcf97;
    --rehearse: #3a3420;
  }
}
:root[data-theme="dark"] {
  --bg: #17161a; --panel: #1f1e23; --ink: #ece8e1; --muted: #9a948a; --line: #34323a;
  --accent: #ef8a54; --accent-soft: #3a2a22; --lyr: #a9c7ef; --dia: #d7d2ca; --mark: #6fcf97;
  --rehearse: #3a3420;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.65 "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px 8px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
h1 { font-size: 16px; margin: 0; letter-spacing: -.01em; }
h1 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
audio { height: 34px; flex: 1 1 320px; min-width: 0; }
button, select { font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent-soft); border-color: var(--accent); }
#strip { width: 100%; height: 54px; display: block; margin-top: 6px; cursor: pointer; border-radius: 4px; background: var(--bg); }
.hint { color: var(--muted); font-size: 12px; }
.wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 0; }
nav { position: sticky; top: 132px; align-self: start; height: calc(100vh - 132px); overflow: auto; border-right: 1px solid var(--line); padding: 8px 0; }
nav a { display: grid; grid-template-columns: 1fr auto; gap: 6px; padding: 4px 14px; color: var(--ink); text-decoration: none; font-size: 13px; }
nav a .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
nav a .t.set { color: var(--mark); }
nav a.cur { background: var(--accent-soft); }
nav a.reh { box-shadow: inset 3px 0 0 #d9a400; }
nav .scene { color: var(--muted); font-size: 11px; padding: 10px 14px 2px; }
main { padding: 8px 28px 50vh; max-width: 820px; }
.scene { font-weight: 700; margin: 34px 0 6px; color: var(--muted); font-size: 13px; letter-spacing: .02em; }
.num { position: sticky; top: 132px; z-index: 2; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  background: var(--bg); margin: 22px -8px 8px; padding: 6px 8px; border-bottom: 2px solid var(--accent); }
.num b { font-size: 17px; color: var(--accent); }
.num .t { font-variant-numeric: tabular-nums; color: var(--mark); font-size: 13px; }
.num .none { color: var(--muted); font-size: 12px; }
section.cur { background: linear-gradient(90deg, var(--accent-soft), transparent 60%); border-radius: 4px; }
section.reh-on { background: var(--rehearse); }
.spk { font-weight: 700; font-size: 13px; margin-top: 10px; }
.lyr { color: var(--lyr); padding-left: 14px; font-weight: 500; }
.dia { color: var(--dia); padding-left: 14px; }
.dir { color: var(--muted); font-style: italic; font-size: 14px; margin: 8px 0; }
@media (max-width: 760px) {
  .wrap { grid-template-columns: 1fr; }
  nav { display: none; }
  main { padding: 8px 16px 50vh; }
  .num { top: 140px; }
}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>브리사 <small id="src"></small></h1>
    <audio id="au" controls preload="metadata"></audio>
    <select id="rate" title="재생 속도">
      <option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
    </select>
    <button id="follow" class="on" title="재생 위치를 따라 대본 스크롤">따라가기</button>
    <button id="reh" title="10/27 연습 장면 강조">27일 장면</button>
    <button id="tap" title="켜면 M 키로 다음 넘버 시작점을 찍음">마킹 모드</button>
    <button id="theme" title="밝게/어둡게">◐</button>
  </div>
  <canvas id="strip"></canvas>
  <div class="hint" id="status">시츠프로브 2026-08-28 · 90분 · 막대 = 음량(노래 구간이 두껍게 보임) · 클릭하면 그 위치로 이동</div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<audio id="guide" preload="none"></audio>
<div id="gate">
  <form id="gate-f">
    <h2>브리사 대본·음원</h2>
    <p>창작진·배우용 공유 페이지야. 비밀번호를 넣어줘.</p>
    <input id="gate-pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <label><input id="gate-keep" type="checkbox" checked> 이 기기에서 기억하기</label>
    <button>열기</button>
    <div id="gate-msg"></div>
  </form>
</div>
<style>
#gate { --g-bg: #f6f4ef; --g-card: #fff; --g-fg: #222; --g-mute: #777; --g-line: #ddd; --g-acc: #2f5d8a;
  position: fixed; inset: 0; z-index: 99; display: grid; place-items: center; padding: 16px; background: var(--g-bg); color: var(--g-fg); }
@media (prefers-color-scheme: dark) { #gate { --g-bg: #16171a; --g-card: #212227; --g-fg: #eee; --g-mute: #999; --g-line: #3a3b40; --g-acc: #7fb0e0; } }
#gate form { width: min(360px, 100%); background: var(--g-card); border: 1px solid var(--g-line); border-radius: 12px; padding: 24px; display: grid; gap: 12px; font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; }
#gate h2 { margin: 0; font-size: 20px; }
#gate p { margin: 0; color: var(--g-mute); font-size: 14px; }
#gate input[type=password] { font: inherit; padding: 10px 12px; border: 1px solid var(--g-line); border-radius: 8px; background: transparent; color: inherit; }
#gate label { font-size: 13px; color: var(--g-mute); display: flex; gap: 6px; align-items: center; }
#gate button { font: inherit; padding: 10px; border: 0; border-radius: 8px; background: var(--g-acc); color: #fff; cursor: pointer; }
#gate-msg { font-size: 13px; color: var(--g-mute); min-height: 1.5em; }
</style>
<script>
(() => {
  const msg = t => document.getElementById("gate-msg").textContent = t;
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  let man, key, files;
  const dec = async buf => new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12)));
  async function get(path) {
    const e = files[path]; if (!e) throw new Error("없는 파일: " + path);
    const r = await fetch(e.f); if (!r.ok) throw new Error(r.status);
    const total = +r.headers.get("content-length") || 0, rd = r.body.getReader(), parts = []; let got = 0;
    for (;;) {
      const { done, value } = await rd.read(); if (done) break;
      parts.push(value); got += value.length;
      if (total > 2e6) document.getElementById("status").textContent = `음원 받는 중… ${Math.round(got / total * 100)}%`;
    }
    const all = new Uint8Array(got); let o = 0; for (const p of parts) { all.set(p, o); o += p.length; }
    return [await dec(all), e.type];
  }
  const urls = {};
  window.SRC = {
    readonly: true,
    json: async p => JSON.parse(new TextDecoder().decode((await get(p))[0])),
    url: async p => urls[p] ||= (([b, t]) => URL.createObjectURL(new Blob([b], { type: t })))(await get(p)),
  };
  async function unlock(raw) {
    key = await crypto.subtle.importKey("raw", raw, "AES-GCM", true, ["decrypt"]);
    if (new TextDecoder().decode(await dec(b64(man.check))) !== "brisa-ok") throw 0;
    files = JSON.parse(new TextDecoder().decode(await dec(b64(man.files))));
  }
  function start() {
    document.getElementById("gate").remove();
    const s = document.createElement("script"); s.textContent = document.getElementById("app").textContent; document.body.appendChild(s);
  }
  const KEEP = "brisa-gate-" + location.pathname;
  (async () => {
    man = await fetch("x/manifest.json", { cache: "no-cache" }).then(r => r.json());
    try { const k = localStorage.getItem(KEEP); if (k && k.startsWith(man.salt + ":")) { await unlock(b64(k.split(":")[1])); return start(); } } catch {}
  })().catch(e => msg("불러오기 실패: " + e));
  document.getElementById("gate-f").onsubmit = async ev => {
    ev.preventDefault(); msg("확인 중…");
    try {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("gate-pw").value), "PBKDF2", false, ["deriveBits"]);
      const raw = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(man.salt), iterations: man.iter, hash: "SHA-256" }, base, 256));
      await unlock(raw);
      if (document.getElementById("gate-keep").checked) try { localStorage.setItem(KEEP, man.salt + ":" + btoa(String.fromCharCode(...raw))); } catch {}
      start();
    } catch { msg("비밀번호가 틀렸어."); }
  };
})();
</script>
<script type="text/plain" id="app">
const REHEARSE = new Set(["M3","M4","M7","M8","M11-a","M11-b","M16","M18-a","M18-b","M19"]);
const $ = s => document.querySelector(s);
// 공유 사이트(site/)에서는 gate가 window.SRC를 넣어줌: 암호화 파일을 풀어서 돌려주고, 마킹은 읽기 전용
const SRC = window.SRC || { json: p => fetch(p).then(r => r.ok ? r.json() : Promise.reject(r.status)), url: async p => p, readonly: false };
const au = $("#au"), guide = $("#guide"), cv = $("#strip"), status = $("#status");
let script, rms, markers = {}, order = [], follow = true, tap = false, lastCur = null;
const marks = () => Object.entries(markers).filter(([k]) => !k.startsWith("_"));
const meta = () => markers._meta || {};

const fmt = s => s == null ? "–" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

async function load() {
  [script, rms] = await Promise.all([SRC.json("data/script.json"), SRC.json("data/rms.json").catch(() => null)]);
  markers = await SRC.json("data/markers.json").catch(() => ({}));
  if (SRC.readonly) $("#tap").hidden = true;
  if (window.SRC) au.src = await SRC.url("audio/sitz.m4a");
  if (!Object.keys(markers).length) markers = store.get("brisa-markers", {});
  $("#src").textContent = "대본 " + script.source;
  render(); drawStrip();
  const t = store.get("brisa-pos", 0); if (t) au.currentTime = t;
  const th = store.get("brisa-theme", null); if (th) document.documentElement.dataset.theme = th;
}

function render() {
  const main = $("#main"), nav = $("#nav");
  main.innerHTML = ""; nav.innerHTML = ""; order = [];
  if (meta().intro) { const i = document.createElement("a"); i.href = "#"; i.innerHTML = `<span>소개 프레젠테이션</span><span class="t set">0:00</span>`; i.onclick = e => { e.preventDefault(); au.currentTime = meta().intro[0]; au.play(); }; nav.appendChild(i); }
  let sec = null, seen = new Set();
  for (const b of script.blocks) {
    if (b.t === "scene") {
      const d = document.createElement("div"); d.className = "scene"; d.textContent = b.text; main.appendChild(d);
      const n = document.createElement("div"); n.className = "scene"; n.textContent = b.text; nav.appendChild(n);
      sec = null; continue;
    }
    if (b.t === "num") {
      const id = b.num + (seen.has(b.num) ? "-cont" : "");
      const first = !seen.has(b.num); seen.add(b.num);
      sec = document.createElement("section"); sec.id = "s-" + id; sec.dataset.num = b.num;
      if (REHEARSE.has(b.num)) sec.classList.add("reh");
      const h = document.createElement("div"); h.className = "num";
      h.innerHTML = `<b>${esc(b.text)}</b>`;
      if (first) {
        order.push(b.num);
        const t = document.createElement("span"); t.className = "t"; t.dataset.num = b.num; h.appendChild(t);
        const nos = (meta().nositz || []).includes(b.num), al = (meta().alias || {})[b.num];
        if (nos) {
          const s = document.createElement("span"); s.className = "none"; s.textContent = "시츠에 없음 · " + ((meta().nositz_note || {})[b.num] || ""); h.appendChild(s);
          if (al) { const go = btn(`▶ ${al} 음원`, () => seek(al)); go.dataset.go = al; h.appendChild(go); }
        } else { const go = btn("▶ 시츠", () => seek(b.num)); go.dataset.go = b.num; h.appendChild(go); }
        h.appendChild(btn("⏱ 지금으로", () => setMark(b.num, au.currentTime)));
        const g = script.guides[b.num.replace(/-.*/, "")];
        if (g) h.appendChild(btn("가이드 ♪", e => playGuide(g, e.target)));
        const a = document.createElement("a"); a.href = "#s-" + id; a.dataset.num = b.num;
        if (REHEARSE.has(b.num)) a.classList.add("reh");
        a.innerHTML = `<span>${esc(b.text)}</span><span class="t" data-num="${b.num}"></span>`;
        if ((meta().nositz || []).includes(b.num)) { a.style.opacity = .5; a.title = "시츠프로브에 없던 넘버"; }
        a.onclick = e => { e.preventDefault(); if (markers[b.num] != null) seek(b.num); sec_(b.num).scrollIntoView({ block: "start" }); };
        nav.appendChild(a);
      }
      h.dataset.num = b.num; sec.appendChild(h); main.appendChild(sec); continue;
    }
    const d = document.createElement("div"); d.className = b.t; d.textContent = b.text;
    (sec || main).appendChild(d);
  }
  paintMarks();
}
const sec_ = n => document.getElementById("s-" + n);
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function btn(label, fn) { const b = document.createElement("button"); b.textContent = label; b.onclick = fn; return b; }

function paintMarks() {
  document.querySelectorAll(".t[data-num]").forEach(el => {
    const v = markers[el.dataset.num];
    const auto = (meta().auto || []).includes(el.dataset.num), weak = (meta().weak || []).includes(el.dataset.num);
    el.textContent = v == null ? "" : (auto ? "≈" : "") + fmt(v) + (weak ? "?" : ""); el.classList.toggle("set", v != null);
    el.title = auto ? "자동 추정 (가이드 음원 매칭)" + (weak ? " · 신뢰 낮음" : "") : "";
  });
  document.querySelectorAll("[data-go]").forEach(b => b.disabled = markers[b.dataset.go] == null);
  drawStrip();
}

async function setMark(num, t) {
  markers[num] = Math.round(t * 10) / 10;
  if (markers._meta) for (const k of ["auto", "weak"]) markers._meta[k] = (markers._meta[k] || []).filter(x => x !== num);
  store.set("brisa-markers", markers); paintMarks();
  if (SRC.readonly) return;
  try {
    const r = await fetch("data/markers.json", { method: "PUT", body: JSON.stringify(markers, null, 1) });
    status.textContent = r.ok ? `${num} = ${fmt(t)} 저장됨` : `${num} 저장 실패 (서버)`;
  } catch { status.textContent = `${num} = ${fmt(t)} (브라우저에만 저장됨)`; }
}
function seek(num) { if (markers[num] == null) return; au.currentTime = markers[num]; au.play(); }

function currentNum(t) {
  let best = null, bt = -1;
  for (const [n, v] of marks()) if (v <= t && v > bt) { best = n; bt = v; }
  return best;
}

function drawStrip() {
  const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const c = cv.getContext("2d"); c.scale(dpr, dpr); c.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement);
  const dur = au.duration || (rms ? rms.db.length * rms.step : 5400);
  if (rms) {
    const db = rms.db, lo = 45, hi = Math.max(...db);
    c.fillStyle = css.getPropertyValue("--muted");
    const per = db.length / w;
    for (let x = 0; x < w; x++) {
      let m = 0; for (let i = Math.floor(x * per); i < Math.floor((x + 1) * per); i++) m = Math.max(m, db[i] || 0);
      const v = Math.max(0, (m - lo) / (hi - lo)); const bh = v * (h - 16);
      c.globalAlpha = .55; c.fillRect(x, h - 2 - bh, 1, bh);
    }
    c.globalAlpha = 1;
  }
  c.font = "10px system-ui"; c.textBaseline = "top";
  const intro = meta().intro;
  if (intro) { c.fillStyle = css.getPropertyValue("--accent-soft"); c.globalAlpha = .6; c.fillRect(intro[0] / dur * w, 0, (intro[1] - intro[0]) / dur * w, h); c.globalAlpha = 1; c.fillStyle = css.getPropertyValue("--muted"); c.fillText("소개 프레젠테이션", 4, h - 14); }
  for (const [n, v] of marks()) {
    const x = v / dur * w;
    c.fillStyle = REHEARSE.has(n) ? "#d9a400" : css.getPropertyValue("--mark");
    c.fillRect(x, 0, 1.5, h); c.fillText(n, x + 2, 1);
  }
  c.fillStyle = css.getPropertyValue("--accent");
  c.fillRect(au.currentTime / dur * w - 1, 0, 2, h);
}
cv.onclick = e => { const dur = au.duration || 5400; au.currentTime = e.offsetX / cv.clientWidth * dur; };

au.ontimeupdate = () => {
  drawStrip(); store.set("brisa-pos", au.currentTime);
  const n = currentNum(au.currentTime);
  if (n !== lastCur) {
    lastCur = n;
    document.querySelectorAll("section.cur, nav a.cur").forEach(e => e.classList.remove("cur"));
    if (n) {
      document.querySelectorAll(`section[data-num="${n}"]`).forEach(e => e.classList.add("cur"));
      const a = document.querySelector(`nav a[data-num="${n}"]`); if (a) { a.classList.add("cur"); a.scrollIntoView({ block: "nearest" }); }
      if (follow && !au.paused) sec_(n)?.scrollIntoView({ block: "start", behavior: "smooth" });
    }
  }
};
au.onloadedmetadata = drawStrip;
addEventListener("resize", drawStrip);

async function playGuide(src, b) {
  if (guide.dataset.src === src && !guide.paused) { guide.pause(); b.classList.remove("on"); return; }
  au.pause(); status.textContent = "가이드 음원 불러오는 중…";
  guide.src = await SRC.url(src); guide.dataset.src = src; guide.play();
  document.querySelectorAll("button.on[data-g]").forEach(x => x.classList.remove("on"));
  b.dataset.g = 1; b.classList.add("on"); status.textContent = "가이드 음원: " + decodeURIComponent(src.split("/").pop());
}

$("#rate").onchange = e => au.playbackRate = +e.target.value;
$("#follow").onclick = e => { follow = !follow; e.target.classList.toggle("on", follow); };
$("#reh").onclick = e => {
  const on = e.target.classList.toggle("on");
  document.querySelectorAll("section.reh").forEach(s => s.classList.toggle("reh-on", on));
};
$("#tap").onclick = e => {
  tap = !tap; e.target.classList.toggle("on", tap);
  status.textContent = tap ? "마킹 모드: 넘버가 시작될 때 M 키 → 지금 위치 앞의 마지막 수동 마킹 다음 넘버(시츠에 없는 M10-b·M17-a·M18-b는 건너뜀, ≈자동값은 덮어씀). Backspace = 되돌리기" : "마킹 모드 끔";
};
$("#theme").onclick = () => {
  const r = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = r.dataset.theme || (dark ? "dark" : "light"), next = cur === "dark" ? "light" : "dark";
  r.dataset.theme = next; store.set("brisa-theme", next); drawStrip();
};
let lastTapped = [];
addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.code === "Space") { e.preventDefault(); au.paused ? au.play() : au.pause(); }
  else if (e.code === "ArrowRight") au.currentTime += e.shiftKey ? 30 : 5;
  else if (e.code === "ArrowLeft") au.currentTime -= e.shiftKey ? 30 : 5;
  else if (tap && e.code === "KeyM") {
    const t = au.currentTime, no = meta().nositz || [], auto = meta().auto || [];
    let lastIdx = -1;
    order.forEach((n, i) => { if (markers[n] != null && !auto.includes(n) && markers[n] <= t + 0.5) lastIdx = Math.max(lastIdx, i); });
    const next = order.slice(lastIdx + 1).find(n => !no.includes(n) && (markers[n] == null || auto.includes(n)));
    if (next) { lastTapped.push([next, markers[next], auto.includes(next), (meta().weak || []).includes(next)]); setMark(next, t); }
  } else if (tap && e.code === "Backspace" && lastTapped.length) {
    const [n, prev, wasAuto, wasWeak] = lastTapped.pop();
    if (prev == null) delete markers[n]; else markers[n] = prev;
    if (markers._meta) { if (wasAuto) markers._meta.auto.push(n); if (wasWeak) markers._meta.weak.push(n); }
    store.set("brisa-markers", markers);
    fetch("data/markers.json", { method: "PUT", body: JSON.stringify(markers, null, 1) }).catch(() => {});
    paintMarks(); status.textContent = n + " 마킹 취소";
  }
});
load();
</script>
